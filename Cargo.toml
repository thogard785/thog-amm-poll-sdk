[package]
name = "thogamm-poll"
description = "Keep a ThogAMM pool current by polling an HTTP RPC endpoint, and quote it locally"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
thogamm = { path = "model" }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
flate2.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[workspace]
members = ["model"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2021"
rust-version = "1.88"
publish = false
license = "MIT"
repository = "https://github.com/thogard785/thog-amm-poll-sdk"

[workspace.dependencies]
alloy-primitives = { version = "=1.7.3", features = ["serde"] }
alloy-sol-types = "=1.7.3"
flate2 = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = "1.48"

[profile.release]
overflow-checks = true
