name: Rust SDK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Check
        run: |
          cargo fmt --all -- --check
          cargo test --locked --release --workspace --all-targets
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build fresh resolver-2 consumer on the minimum Rust version
        shell: bash
        run: |
          consumer_dir=$(mktemp -d)
          mkdir "$consumer_dir/src"
          cat > "$consumer_dir/Cargo.toml" <<EOF
          [package]
          name = "sdk-consumer"
          version = "0.0.0"
          edition = "2021"
          rust-version = "1.88"
          resolver = "2"
          [dependencies]
          state-poll-sdk = { path = "$GITHUB_WORKSPACE" }
          alloy-primitives = "=1.7.2"
          EOF
          echo 'fn main() { let _: state_poll_sdk::U256 = alloy_primitives::U256::ZERO; }' > "$consumer_dir/src/main.rs"
          cargo check --manifest-path "$consumer_dir/Cargo.toml"
